# Railway service: dulacmycamp-web
#
# This service builds from the REPOSITORY ROOT, not from apps/web, and is
# pointed at this file via the service's "config file path" setting.
#
# Why: apps/web has no lockfile of its own — pnpm-lock.yaml lives at the
# workspace root. Building with apps/web as the root directory made nixpacks
# run `pnpm i --frozen-lockfile` against a directory with no lockfile, which
# fails. Building from the root uses the committed lockfile, so deploys are
# reproducible instead of resolving dependencies afresh every time.
#
# VITE_API_URL must be set on the service before the build: Vite inlines it,
# so changing it requires a redeploy, not just a restart.

[build]
builder = "nixpacks"
# nixpacks runs `pnpm i --frozen-lockfile` at the root on its own; this only
# has to produce the bundle.
buildCommand = "pnpm --filter @dulacmycamp/web build"

[deploy]
# `pnpm exec` runs inside the package directory, so `dist` is apps/web/dist.
startCommand = "pnpm --filter @dulacmycamp/web exec serve -s dist -l $PORT"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
