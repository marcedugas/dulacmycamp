# Railway service: dulacmycamp-api
# Set the service's root directory to `services/api` in the Railway dashboard.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "dulacmycamp-api"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
