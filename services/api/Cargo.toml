[package]
name = "dulacmycamp-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# argon2id for the optional admin password login. Matches the hashing choice
# in the sibling ShiftScheduler app so the two stay consistent.
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
# Decode/resize/re-encode for upload compression (see `uploads.rs`). JPEG,
# PNG and WebP only — the three types uploads accept — so no codec for a
# format nothing can send is compiled in.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros", "migrate", "json"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[profile.release]
# Keep LTO off: it roughly triples link time and Railway's build window is
# finite. The binary is small enough that the extra optimisation is noise.
lto = false
codegen-units = 16
# Do NOT set panic = "abort" — unwinding is required if a panic-catching
# middleware layer is added later.

# Image decoding and resizing in an unoptimised debug build runs 10-50x slower
# — long enough for a local upload of a phone photo to feel hung. Optimise
# just the codec crates so `cargo run` stays representative without slowing
# the rest of the dev build.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
